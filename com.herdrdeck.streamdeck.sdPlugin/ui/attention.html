<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Next Attention</title>
<link rel="stylesheet" href="pi.css" />
<script src="pi.js"></script>
</head>
<body>
<div id="status" class="status">Connecting…</div>

<div class="row">
  <label for="done">Include done</label>
  <input id="done" type="checkbox" data-setting="includeDone" data-default="true" />
  <div class="hint">Blocked agents always come first. With this on, finished (done) agents are next in the cycle.</div>
</div>

<div id="connection"></div>
</body>
</html>
