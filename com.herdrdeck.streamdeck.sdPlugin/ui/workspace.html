<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Workspace</title>
<link rel="stylesheet" href="pi.css" />
<script src="pi.js"></script>
</head>
<body>
<div id="status" class="status">Connecting…</div>

<div class="row">
  <label for="mode">Show</label>
  <select id="mode" data-setting="mode" data-default="slot">
    <option value="slot">Workspace by position</option>
    <option value="id">A specific workspace</option>
  </select>
</div>
<div class="row" data-show-when="mode=slot">
  <label for="slot">Position</label>
  <input id="slot" type="number" min="1" max="64" data-setting="slot" data-default="1" />
</div>
<div class="row" data-show-when="mode=id">
  <label for="ws">Workspace</label>
  <select id="ws" data-setting="workspaceId"></select>
</div>
<script>
window.onOptions = (p) => setSelectOptions("ws", p.workspaces, "workspace_id", "workspaceId");
</script>

<div id="connection"></div>
</body>
</html>
