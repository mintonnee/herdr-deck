<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent</title>
<link rel="stylesheet" href="pi.css" />
<script src="pi.js"></script>
</head>
<body>
<div id="status" class="status">Connecting…</div>

<div class="row">
  <label for="mode">Show</label>
  <select id="mode" data-setting="mode" data-default="slot">
    <option value="slot">Agent by position</option>
    <option value="pane">A specific pane</option>
  </select>
</div>
<div class="row" data-show-when="mode=slot">
  <label for="slot">Position</label>
  <input id="slot" type="number" min="1" max="64" data-setting="slot" data-default="1" />
  <div class="hint">1 = first agent in workspace/tab order. Lay keys 1, 2, 3… for a live agent board.</div>
</div>
<div class="row" data-show-when="mode=pane">
  <label for="pane">Pane</label>
  <select id="pane" data-setting="paneId"></select>
  <div class="hint">Pane ids (w1:p2) can change if you rebuild the layout.</div>
</div>
<script>
window.onOptions = (p) => setSelectOptions("pane", p.agents, "pane_id", "paneId");
</script>

<div id="connection"></div>
</body>
</html>
