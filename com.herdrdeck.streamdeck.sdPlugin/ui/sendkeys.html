<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Send Keys</title>
<link rel="stylesheet" href="pi.css" />
<script src="pi.js"></script>
</head>
<body>
<div id="status" class="status">Connecting…</div>

<div class="row">
  <label for="keys">Keys</label>
  <input id="keys" type="text" data-setting="keys" data-default="esc" />
  <div class="hint">Space-separated herdr key combos: esc, enter, ctrl+c, shift+tab, f1, y …</div>
</div>
<div class="row">
  <label for="target">Send to</label>
  <select id="target" data-setting="target" data-default="focused">
    <option value="focused">Focused pane</option>
    <option value="slot">Agent by position</option>
    <option value="pane">A specific pane</option>
  </select>
  <div class="hint">"Focused pane" is safest: you can see what you are answering.</div>
</div>
<div class="row" data-show-when="target=slot">
  <label for="slot">Position</label>
  <input id="slot" type="number" min="1" max="64" data-setting="slot" data-default="1" />
</div>
<div class="row" data-show-when="target=pane">
  <label for="pane">Pane</label>
  <select id="pane" data-setting="paneId"></select>
</div>
<script>
window.onOptions = (p) => setSelectOptions("pane", p.agents, "pane_id", "paneId");
</script>

<div id="connection"></div>
</body>
</html>
